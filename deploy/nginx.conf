# ChimpHouse's room server behind Nginx on a VPS (docs/deploy.md, option 1): use this OR the
# Caddyfile. Save as /etc/nginx/sites-available/chimphouse-room, link it into sites-enabled,
# replace room.example.com, then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS certificate: sudo certbot --nginx -d room.example.com (it adds the port 443 settings).

# a WebSocket connection says "Upgrade"; an ordinary request says nothing
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name room.example.com;

    location / {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;

        # WebSockets: pass the upgrade on
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # the page's own Origin header goes through untouched (the server checks it)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nginx gives up on a connection that is quiet for 60 s unless told otherwise: a visitor
        # standing still could be dropped. A day:
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_buffering off;
    }
}

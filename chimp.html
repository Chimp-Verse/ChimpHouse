<!doctype html>
<!--
  The chimp lab: one chimp under house-like light, for working on how chimps look and
  move without loading the whole house. http://localhost:5173/chimp.html
  ?view=front|three|side|back|face|hands|feet  ?anim=idle|walk|run|sit|perch|lounge|rest  ?t=<seconds>
  ?shells=<n>  ?dna=<JSON>  ?night=1  ?random=<seed>
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chimp lab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14110e;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #info {
        position: absolute;
        left: 12px;
        top: 10px;
        color: #e8dcc8;
        font: 12px/1.45 ui-monospace, monospace;
        white-space: pre;
        background: rgba(0, 0, 0, 0.45);
        padding: 8px 10px;
        border-radius: 8px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="info">Building a chimp…</div>
    <script type="module" src="/src/lab/chimpLab.ts"></script>
  </body>
</html>
